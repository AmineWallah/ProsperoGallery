<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProsperoGallery</title>
<style>
  :root { --bg: #0b0d12; --surface: #151922; --border: #262c3b; --text: #e8ebf2; --muted: #8a93a6; --accent: #3d7bff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; padding: 24px; }
  .card { display: flex; gap: 56px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 1100px; }
  .qr { width: min(420px, 80vw); aspect-ratio: 1; background: #fff; border-radius: 18px; padding: 10px; }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .text { max-width: 520px; }
  h1 { font-size: 40px; margin: 0 0 8px; font-weight: 700; }
  .lead { color: var(--muted); margin: 0 0 28px; font-size: 20px; }
  .label { color: var(--muted); font-size: 15px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .url { font: 600 34px/1.2 ui-monospace, "SF Mono", Menlo, monospace; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; word-break: break-all; }
  .hint { color: var(--muted); font-size: 16px; margin: 22px 0 0; }
  a.browse { display: inline-block; margin-top: 28px; color: #fff; background: var(--accent);
    text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 600; }
  a.browse:focus { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="qr"><img src="/qr.svg" alt="QR code for the gallery address"></div>
    <div class="text">
      <h1>ProsperoGallery</h1>
      <p class="lead">Scan the code with your phone's camera, or type the address into any browser.</p>
      <div class="label">Address</div>
      <div class="url" id="url">…</div>
      <p class="hint">Your phone or PC has to be on the same network as this PS5.</p>
      <a class="browse" href="/">Browse on this PS5</a>
    </div>
  </div>
<script>
  fetch("/api/info", { cache: "no-store" })
    .then((r) => r.json())
    .then((info) => { document.getElementById("url").textContent = info.url; })
    .catch(() => { document.getElementById("url").textContent = "Couldn't get the address"; });
</script>
</body>
</html>
